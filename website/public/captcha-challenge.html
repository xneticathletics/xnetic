<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Doğrulama</title>
<!-- Callback'ler Turnstile yüklenmeden ÖNCE tanımlı olmalı; bu yüzden
     harici script api.js'ten önce ve async/defer olmadan geliyor. -->
<script src="/captcha-challenge.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #10122A;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, system-ui, sans-serif;
  }
  #status {
    color: #9CA3AF;
    font-size: 13px;
    margin-top: 12px;
    text-align: center;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
</style>
</head>
<body>
<div id="wrap">
  <div class="cf-turnstile"
       data-sitekey="0x4AAAAAAEqiHSj1HJUkLV8K"
       data-theme="dark"
       data-callback="onTurnstileSuccess"
       data-expired-callback="onTurnstileExpired"
       data-error-callback="onTurnstileError">
  </div>
  <div id="status">Doğrulanıyor…</div>
</div>
</body>
</html>
